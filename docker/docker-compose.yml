# Nombre de proyecto explícito: sin esto, Compose lo infiere del nombre del
# directorio que contiene este archivo ("docker"), lo que prefijaría
# volúmenes/redes como "docker_..." en vez de algo reconocible.
name: gabicho-storage

services:
  api:
    build:
      # Contexto = raíz del repo (no "docker/"): el Dockerfile necesita
      # poder hacer COPY de "core/", que es hermano de este directorio.
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gabicho-storage-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_NAME: ${DB_NAME:-storage}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      STORAGE_PATH: /data/storage
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TOKEN_EXPIRY_MINUTES: ${TOKEN_EXPIRY_MINUTES:-15}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-30}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Los tres valores sensibles se leen de archivos (Docker secrets, ver
      # bloque "secrets" al final) en vez de pasarse en texto plano acá: un
      # valor puesto directo en `environment:` queda visible para siempre
      # en `docker inspect <container>` y en `docker compose config`.
      DB_PASSWORD_FILE: /run/secrets/db_password
      SIGNING_SECRET_FILE: /run/secrets/signing_secret
      ADMIN_MASTER_KEY_FILE: /run/secrets/admin_master_key
    secrets:
      - db_password
      - signing_secret
      - admin_master_key
    volumes:
      - storage_data:/data/storage
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - storage_net

  sqlserver:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: gabicho-storage-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      # La imagen oficial no soporta _FILE nativamente; el wrapper en
      # database/entrypoint-secrets.sh sí (lee este archivo y exporta
      # MSSQL_SA_PASSWORD antes de arrancar SQL Server).
      MSSQL_SA_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/secrets/db_password)\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - storage_net
    # No se publica el puerto 1433 al host: sólo es accesible desde la red
    # interna de docker-compose (el servicio "api").

networks:
  storage_net:
    driver: bridge

volumes:
  mssql_data:
  storage_data:

# Docker secrets basados en archivo (no requiere Swarm, funciona con
# `docker compose` normal): cada archivo se monta de sólo lectura en
# /run/secrets/<nombre> dentro del contenedor. Generarlos con
# scripts/generate-secrets.sh, o a mano con `openssl rand -hex 32 > secrets/<archivo>`.
# El directorio secrets/ está en .gitignore: estos archivos NUNCA deben
# commitearse.
secrets:
  db_password:
    file: ../secrets/db_password.txt
  signing_secret:
    file: ../secrets/signing_secret.txt
  admin_master_key:
    file: ../secrets/admin_master_key.txt
